services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iticket
      POSTGRES_PASSWORD: iticket
      POSTGRES_DB: iticket
    ports:
      - "5432:5432"
    volumes:
      - iticket_pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgresql://iticket:iticket@postgres:5432/iticket
      PORT: 4000
      CORS_ORIGIN: http://${PUBLIC_HOST:-localhost}:5173
    ports:
      - "4000:4000"
    volumes:
      - iticket_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://${PUBLIC_HOST:-localhost}:4000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  iticket_pg_data:
  iticket_uploads:
